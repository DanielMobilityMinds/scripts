<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scripts</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111114; color: #fff; }
    main { width: min(640px, calc(100% - 40px)); }
    h1 { font-size: clamp(36px, 7vw, 64px); margin: 0 0 8px; }
    p { color: #bbb; line-height: 1.5; }
    a { display: block; margin-top: 32px; padding: 24px; border: 1px solid #ff7046; border-radius: 16px;
      color: #fff; background: #241815; text-decoration: none; font-size: 22px; font-weight: 750; }
    a:hover, a:focus-visible { background: #422019; outline: 2px solid #ff9b65; }
    small { display: block; margin-top: 7px; color: #d5b9ae; font-size: 14px; font-weight: 400; }
  </style>
</head>
<body>
  <main>
    <h1>Scripts</h1>
    <p>Kleine Browser-Experimente zum Ausprobieren.</p>
    <a href="rage-mode/">💥 Rage Mode<small>Ziehbarer Button für die Lesezeichenleiste</small></a>
  </main>
</body>
</html>
